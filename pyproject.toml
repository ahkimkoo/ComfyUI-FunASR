[project]
name = "ComfyUI-FunASR"
version = "1.0.0"
description = "ComfyUI custom node for offline Chinese speech-to-text using FunASR with VAD and punctuation support."
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "funasr>=1.0.0",
    "modelscope",
    "torchaudio",
]

[project.urls]
Repository = "https://github.com/ahkimkoo/ComfyUI-FunASR"

[tool.comfy]
PublisherId = "ahkimkoo"
DisplayName = "ComfyUI FunASR - Offline Chinese Speech to Text"
Icon = "https://raw.githubusercontent.com/ahkimkoo/ComfyUI-FunASR/main/icon.svg"
